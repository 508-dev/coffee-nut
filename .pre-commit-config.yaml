# Optional. `./scripts/check-all.sh` is the real gate and is what CI runs;
# these hooks just catch formatting before it reaches a diff.
#
#   uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        pass_filenames: false
        files: ^apps/api/.*\.py$|^pyproject\.toml$
      - id: biome
        name: biome
        entry: bun run format:check
        language: system
        pass_filenames: false
        files: ^apps/web/|^biome\.json$|^package\.json$
