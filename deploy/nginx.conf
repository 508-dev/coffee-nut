# The web container: static SPA, Django's static files, and a reverse proxy to
# the api service, all on one origin. Sits behind the platform's TLS proxy
# (Traefik on Coolify), which is the only thing that can reach it.

# Docker's embedded DNS. Resolving per request rather than once at startup means
# a recreated api container cannot leave nginx pointing at a dead address.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Only the TLS proxy can reach this container, so trust the address it
  # appends. Without this, Django would see the proxy's IP for every client and
  # throttle everyone as one user; passing the header through unchanged would
  # let a client pick its own throttle identity.
  set_real_ip_from 0.0.0.0/0;
  real_ip_header X-Forwarded-For;

  client_max_body_size 10m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location ~ ^/(api|admin|health)/ {
    set $api http://api:8000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /static/ {
    alias /usr/share/nginx/static/;
    expires 7d;
  }

  # Content-hashed by Vite, so safe to cache for good.
  location /_app/immutable/ {
    expires max;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback: every other path is a client-side route.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
