name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Pinned so an upstream release cannot change what CI runs without a review.
  # Keep in step with .python-version and package.json's packageManager field.
  UV_VERSION: "0.12.6"
  BUN_VERSION: "1.4.0"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # paths-filter runs with token: "" below, so it needs enough history
          # to compare commits locally instead of calling the PR files API.
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          # Keep the workflow at contents:read. Empty token forces git-based
          # detection and avoids requiring pull-requests:read.
          token: ""
          filters: |
            api:
              - "apps/api/**"
              - "pyproject.toml"
              - "uv.lock"
              - ".python-version"
              - "scripts/*.sh"
              - "apps/web/src/lib/api/schema.d.ts"
            web:
              - "apps/web/**"
              - "package.json"
              - "bun.lock"
              - "biome.json"
              - "scripts/*.sh"
            infra:
              - "compose.yml"
              - "docker-compose.yml"
              - ".env.example"
            workflow:
              - ".github/workflows/**"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest

    services:
      # Real Postgres, not SQLite: the schema uses CHECK constraints and partial
      # unique indexes that SQLite models differently, so SQLite would pass
      # tests that production would reject.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_SETTINGS_MODULE: coffeenut.settings.test
      PYTHONPATH: apps/api:apps/api/src

    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Django checks
        run: uv run python apps/api/manage.py check

      - name: Missing migrations
        # A model change without a migration is the most common way this repo
        # breaks for everyone else. Cheap to check, expensive to discover late.
        run: uv run python apps/api/manage.py makemigrations --check --dry-run

      - name: Tests
        run: uv run pytest

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: API types are in sync
        # Generated from the OpenAPI schema and committed. If they drift, the
        # SPA typechecks against an API that no longer exists.
        run: ./scripts/generate-api-types.sh --check

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest

    env:
      PUBLIC_API_BASE_URL: http://127.0.0.1:8720/api/v1

    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build

  compose:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Validate Compose config
        run: docker compose -f compose.yml --env-file .env.example config

  ci-passed:
    if: always()
    needs:
      - changes
      - api
      - web
      - compose
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          changes_result='${{ needs.changes.result }}'
          api_result='${{ needs.api.result }}'
          web_result='${{ needs.web.result }}'
          compose_result='${{ needs.compose.result }}'
          if [ "$changes_result" != "success" ]; then
            echo "The changes job did not pass: changes=${changes_result}" >&2
            exit 1
          fi
          # Component jobs may be skipped by the path filter. That is healthy
          # only when path detection itself succeeded, which is checked above.
          for result in "$api_result" "$web_result" "$compose_result"; do
            case "$result" in
              success|skipped)
                ;;
              *)
                echo "A required CI job did not pass: changes=${changes_result}, api=${api_result}, web=${web_result}, compose=${compose_result}" >&2
                exit 1
                ;;
            esac
          done
